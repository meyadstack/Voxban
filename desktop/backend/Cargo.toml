[package]
name = "voxban-backend"
version = "3.4.1"
edition = "2021"
description = "Rust backend for Voxban Windows PC — Kanban, Calendar Reminders, Voice AI, Notes, Money, Vault, Workouts, Music Player & Downloader, Support Tickets, and Phone QR LAN Sync"

[lib]
name = "voxban_backend"
path = "src/lib.rs"

[[bin]]
name = "voxban-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
qrcode = "0.14"
base64 = "0.22"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
hmac = "0.12"
dirs = "5"
urlencoding = "2"
hostname = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
bytes = "1"
rust-embed = { version = "8", optional = true }
mime_guess = "2"
open = "5"

[features]
default = []
embed-ui = ["dep:rust-embed"]

[package]
name = "voxban-desktop"
version = "3.4.0"
description = "Voxban for Windows PC — Native Rust + WebView2 Desktop App"
authors = ["meyadstack"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
voxban-backend = { path = "../backend", features = ["embed-ui"] }
